server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql:3306/devflow?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:schema-cloud.sql
  web:
    resources:
      add-mappings: true
  mvc:
    throw-exception-if-no-handler-found: false

devflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
