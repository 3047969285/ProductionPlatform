services:
  - type: web
    name: devflow
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.standalone
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # 新数据库首次初始化后，将此变量改为 never，避免重写种子数据。
      - key: SQL_INIT_MODE
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://3047969285.github.io
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: JAVA_OPTS
        value: "-Xmx160m -Xms48m -XX:+UseSerialGC -XX:MaxMetaspaceSize=64m -XX:ReservedCodeCacheSize=32m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
